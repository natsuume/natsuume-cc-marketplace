name: agent-discipline-prompt-lint

# agent-discipline plugin のモデル別プロンプトファイル (always-fable.md /
# always-sonnet-1.md / always-sonnet-2.md / always-sonnet-3.md、issue #236 で
# always-sonnet.md から 3 part に分割) と hooks.json の 4 type:agent entries
# (gh issue/pr create/edit) が同期ドリフトしていないかを検証する構造 lint CI (#178)。
# チェック内容の詳細契約はスクリプト本体のヘッダコメントを参照:
#   plugins/agent-discipline/scripts/lint-prompt-sync.sh
#
# 同じ job で、agent-discipline の注入スクリプトを模擬 hook input で実行し、
# additionalContext 1 要素の文字数を実測するサイズ lint (警告 7,800 字 / 上限 8,000 字) も
# 実行する。契約と「対象スクリプト × 分岐 × 期待」の対応表はスクリプト本体を参照:
#   plugins/agent-discipline/scripts/lint-payload-size.sh
#
# ubuntu-latest には jq と git が標準搭載されているため、 スクリプトが依存するツールの追加
# セットアップ step は不要 (不在時はスクリプト自身が明確なエラーで exit 1 する)。

on:
  pull_request:
    paths:
      # ルール ID コメントを持つモデル別プロンプトファイル (チェック 1 の対象)
      - "plugins/agent-discipline/hooks/prompts/always-fable.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-1.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-2.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-3.md"
      # type:agent 4 entries を持つ hook 設定 (チェック 2 の対象)
      - "plugins/agent-discipline/hooks/hooks.json"
      # ルール ID コメントを持つ分業規律モデル別プロンプトファイル (チェック 4 の対象)
      - "plugins/agent-discipline/hooks/prompts/discipline-fable.md"
      - "plugins/agent-discipline/hooks/prompts/discipline-sonnet.md"
      - "plugins/agent-discipline/hooks/prompts/discipline-opus.md"
      # subagent 向けルールファイル (チェック 5 のサブセット検査対象、#221)
      - "plugins/agent-discipline/hooks/prompts/subagent-rules.md"
      # サイズ lint の実測対象: hooks/prompts/ 配下の全 md (temporary/ を含む) と、
      # 注入スクリプト・除外スクリプト・共有 lib を含む hooks/scripts/ 配下の全ファイル
      - "plugins/agent-discipline/hooks/prompts/**/*.md"
      - "plugins/agent-discipline/hooks/scripts/**"
      # lint スクリプト自身と本 workflow 自身 (契約変更時も CI が追従することを保証する)
      - "plugins/agent-discipline/scripts/lint-prompt-sync.sh"
      - "plugins/agent-discipline/scripts/lint-payload-size.sh"
      - ".github/workflows/agent-discipline-prompt-lint.yml"
      # experimental-agent-discipline (fork) 側の同じ検査対象一式
      - "plugins/experimental-agent-discipline/hooks/prompts/always-fable.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-1.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-2.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-3.md"
      - "plugins/experimental-agent-discipline/hooks/hooks.json"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-fable.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-sonnet.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-opus.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/subagent-rules.md"
      - "plugins/experimental-agent-discipline/scripts/lint-prompt-sync.sh"
  push:
    branches: [master]
    paths:
      - "plugins/agent-discipline/hooks/prompts/always-fable.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-1.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-2.md"
      - "plugins/agent-discipline/hooks/prompts/always-sonnet-3.md"
      - "plugins/agent-discipline/hooks/hooks.json"
      - "plugins/agent-discipline/hooks/prompts/discipline-fable.md"
      - "plugins/agent-discipline/hooks/prompts/discipline-sonnet.md"
      - "plugins/agent-discipline/hooks/prompts/discipline-opus.md"
      - "plugins/agent-discipline/hooks/prompts/subagent-rules.md"
      - "plugins/agent-discipline/hooks/prompts/**/*.md"
      - "plugins/agent-discipline/hooks/scripts/**"
      - "plugins/agent-discipline/scripts/lint-prompt-sync.sh"
      - "plugins/agent-discipline/scripts/lint-payload-size.sh"
      - ".github/workflows/agent-discipline-prompt-lint.yml"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-fable.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-1.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-2.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/always-sonnet-3.md"
      - "plugins/experimental-agent-discipline/hooks/hooks.json"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-fable.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-sonnet.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/discipline-opus.md"
      - "plugins/experimental-agent-discipline/hooks/prompts/subagent-rules.md"
      - "plugins/experimental-agent-discipline/scripts/lint-prompt-sync.sh"

permissions:
  contents: read

jobs:
  prompt-sync:
    name: agent-discipline prompt sync lint (rule ID set + hooks.json common block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # lint-prompt-sync.sh は引数を取らず、 リポジトリルートからの相対パスで
      # always-fable.md / always-sonnet-{1,2,3}.md / hooks.json を参照する契約のため、
      # working-directory を指定せずリポジトリルートのまま実行する。
      - name: Run lint-prompt-sync.sh (rule ID set + hooks.json common block sync check)
        run: ./plugins/agent-discipline/scripts/lint-prompt-sync.sh

      # lint-payload-size.sh も引数を取らず、 リポジトリルートからの相対パスで hooks/scripts/ と
      # hooks.json を参照する。 注入スクリプトは lint が mktemp -d で作る隔離 TMPDIR 上で実行される。
      # WARN (7,800 字超) は exit code に影響せず、 FAIL (8,000 字超・fail-closed 規則違反) で失敗する。
      - name: Run lint-payload-size.sh (additionalContext element size check)
        run: ./plugins/agent-discipline/scripts/lint-payload-size.sh

      # fork 側 (experimental-agent-discipline) は plugins/experimental-agent-discipline/ 配下を
      # 参照する同内容の lint スクリプトを持つため、同じ job 内で続けて実行する。
      - name: Run lint-prompt-sync.sh for experimental-agent-discipline (fork)
        run: ./plugins/experimental-agent-discipline/scripts/lint-prompt-sync.sh
