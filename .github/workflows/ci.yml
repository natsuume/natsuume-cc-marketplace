name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.210"

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit and adapter tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install pinned Claude Code and validate the marketplace
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate . --strict

      - name: Check all shell scripts with the platform Bash
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            bash -n "$file"
            checked=$((checked + 1))
          done < <(find plugins scripts -type f -name '*.sh' -print0)
          echo "OK: bash -n passed for $checked scripts."

      - name: Run ShellCheck with repository parser/library exclusions
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            shellcheck \
              -e SC1003,SC2016,SC2034,SC2119,SC2154,SC2221,SC2222,SC2317 \
              -x -P SCRIPTDIR "$file"
          done < <(find plugins scripts -type f -name '*.sh' -print0)

      - name: Require plugin version bumps
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_plugin_versions.py "$BASE_REVISION"

      - name: Require plugin version bumps on direct master push
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: |
          if [ "$BASE_REVISION" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous branch revision; skipping version comparison."
            exit 0
          fi
          python3 scripts/check_plugin_versions.py --direct "$BASE_REVISION"
