query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      timelineItems(
        first: 100
        after: $endCursor
        itemTypes: [LABELED_EVENT, UNLABELED_EVENT, ISSUE_COMMENT, CLOSED_EVENT, REOPENED_EVENT]
      ) {
        # PR 側の PullRequestTimelineItemsConnection.totalCount が itemTypes を
        # 無視する非対称が実測されているため (検証日: 2026-08-20)、全テンプレートで
        # 一様にフィルタ後件数の filteredCount を totalCount へ alias して取得する
        totalCount: filteredCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          __typename
          ... on LabeledEvent {
            createdAt
            label {
              name
            }
          }
          ... on UnlabeledEvent {
            createdAt
            label {
              name
            }
          }
          ... on IssueComment {
            createdAt
            body
          }
          ... on ClosedEvent {
            createdAt
            closer {
              __typename
              ... on PullRequest {
                number
                repository {
                  nameWithOwner
                }
                merged
              }
              ... on Commit {
                oid
              }
            }
          }
          ... on ReopenedEvent {
            createdAt
          }
        }
      }
    }
  }
}
