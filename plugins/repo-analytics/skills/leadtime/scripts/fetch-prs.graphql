query($owner: String!, $name: String!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    pullRequests(first: 50, after: $endCursor, states: [MERGED]) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        createdAt
        mergedAt
        additions
        deletions
        timelineItems(
          first: 100
          itemTypes: [READY_FOR_REVIEW_EVENT, CONVERT_TO_DRAFT_EVENT]
        ) {
          totalCount
          nodes {
            __typename
            ... on ReadyForReviewEvent {
              createdAt
            }
            ... on ConvertToDraftEvent {
              createdAt
            }
          }
        }
        closingIssuesReferences(first: 20) {
          nodes {
            number
            repository {
              nameWithOwner
            }
          }
        }
      }
    }
  }
}
