query($owner: String!, $name: String!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    nameWithOwner
    issues(first: 50, after: $endCursor, states: [OPEN, CLOSED]) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        title
        state
        stateReason
        createdAt
        closedAt
        timelineItems(
          first: 100
          itemTypes: [LABELED_EVENT, UNLABELED_EVENT, ISSUE_COMMENT, CLOSED_EVENT, REOPENED_EVENT]
        ) {
          # PR 側の PullRequestTimelineItemsConnection.totalCount が itemTypes を
          # 無視する非対称が実測されているため (検証日: 2026-08-20)、全テンプレートで
          # 一様にフィルタ後件数の filteredCount を totalCount へ alias して取得する
          totalCount: filteredCount
          nodes {
            __typename
            ... on LabeledEvent {
              createdAt
              label {
                name
              }
            }
            ... on UnlabeledEvent {
              createdAt
              label {
                name
              }
            }
            ... on IssueComment {
              createdAt
              body
            }
            ... on ClosedEvent {
              createdAt
              closer {
                __typename
                ... on PullRequest {
                  number
                  repository {
                    nameWithOwner
                  }
                  merged
                }
                ... on Commit {
                  oid
                }
              }
            }
            ... on ReopenedEvent {
              createdAt
            }
          }
        }
      }
    }
  }
}
